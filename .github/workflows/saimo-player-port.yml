name: CineHUB Player Port CI
# CI is intentionally attached to the isolated rewrite branch until the port is validated.

on:
  push:
    branches:
      - "rewrite/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        run: gradle --no-daemon :player-core:test :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: cinehub-player-saimo-port-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Saimo player activity and resources were ported into the isolated CineHUB branch; validate on every update.
